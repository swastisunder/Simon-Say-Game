<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Page Title -->
    <title>Simon Say Games</title>
    <!-- External Stylesheet -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Main Content -->
    <h1>Simon Say Games</h1>
    <h2>Press any key to start</h2>
    <!-- Container for Buttons -->
    <div class="btn-container">
      <!-- First Row of Buttons -->
      <div class="line-one">
        <!-- Red Button -->
        <div class="btn red" id="red" type="button"></div>
        <!-- Yellow Button -->
        <div class="btn yellow" id="yellow" type="button"></div>
      </div>
      <!-- Second Row of Buttons -->
      <div class="line-two">
        <!-- Green Button -->
        <div class="btn green" id="green" type="button"></div>
        <!-- Purple Button -->
        <div class="btn purple" id="purple" type="button"></div>
      </div>
    </div>

    <!-- External JavaScript -->
    <script src="app.js"></script>
  </body>
</html>
